<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarSnack | Official Links</title>
    <style>
        :root {
            --bg-outer: #e5e7eb;
            --card-bg: #717174;
            --btn-bg: #eaf4f8;
            --btn-hover: #ffffff;
            --text-dark: #111827;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-outer);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .hub-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 820px;
            border-radius: 36px;
            padding: 44px 40px;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 36px;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        .profile-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background-color: #09090b;
            border: 2px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            overflow: hidden;
        }

        .avatar-badge {
            border: 1.5px solid #ffffff;
            padding: 3px 6px;
            color: #ffffff;
            font-family: "Courier New", Courier, monospace;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 0 #ef4444;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1.brand-title {
            font-family: "Courier New", Courier, monospace;
            font-size: 46px;
            font-weight: 700;
            color: #09090b;
            letter-spacing: -1px;
            margin-bottom: 22px;
            line-height: 1;
        }

        .tagline {
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #18181b;
            margin-bottom: 14px;
            text-align: center;
            width: 100%;
        }

        .bio-copy {
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #18181b;
            line-height: 1.7;
            text-align: center;
            width: 100%;
        }

        .links-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .pill-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 24px;
            background-color: var(--btn-bg);
            color: var(--text-dark);
            text-decoration: none;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .pill-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }

        .pill-btn svg {
            width: 20px;
            height: 20px;
            fill: #374151;
            flex-shrink: 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-box {
            background-color: #18181b;
            color: #f4f4f5;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }

        .modal-box h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #a1a1aa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 999px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #27272a;
            color: #d4d4d8;
        }

        .btn-confirm {
            background-color: var(--accent);
            color: #ffffff;
        }

        .btn-confirm:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 680px) {
            .hub-card {
                grid-template-columns: 1fr;
                padding: 36px 24px;
                border-radius: 28px;
                gap: 28px;
            }
            .profile-col {
                align-items: center;
                text-align: center;
            }
            h1.brand-title {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

    <main class="hub-card">
        <section class="profile-col">
            <div class="avatar">
                <span class="avatar-badge">EARSNACK</span>
            </div>

            <h1 class="brand-title">EarSnack</h1>

            <p class="tagline">EARSNACK | INDEPENDENT ARTIST</p>
            <p class="bio-copy">
                MUSIC ABOUT FEELING THINGS TOO DEEPLY IN A DIGITAL WORLD.
            </p>
        </section>

        <section class="links-col">
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="pill-btn">
                <span>TikTok</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            </a>

            <button type="button" class="pill-btn" onclick="document.getElementById('ageModal').style.display='flex'">
                <span>Exclusive VIP Access</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>

            <a href="https://bandcamp.com" target="_blank" rel="noopener noreferrer" class="pill-btn">
                <span>Bandcamp</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 18.75l7.437-13.5H24l-7.438 13.5H0z"/></svg>
            </a>

            <a href="https://soundcloud.com" target="_blank" rel="noopener noreferrer" class="pill-btn">
                <span>SoundCloud</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.56 8.87V17h8.76c1.85 0 3.35-1.67 3.35-3.73 0-1.91-1.3-3.48-2.97-3.7-.35-2.61-2.38-4.63-4.86-4.63-1.85 0-3.46 1.13-4.28 2.78v1.15zm-2.14.95v7.18h1.18V9.43a5.4 5.4 0 0 0-1.18.39zm-2.13 1.44v5.74h1.18v-6.06c-.42.06-.81.17-1.18.32zm-2.13 1.38v4.36h1.18v-4.5c-.41.01-.81.06-1.18.14zm-2.13 1.04v3.32h1.18v-3.22a3.3 3.3 0 0 0-1.18-.1zM1.1 14.8v2.2h1.07v-2.1c-.4-.13-.77-.15-1.07-.1z"/></svg>
            </a>

            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="pill-btn">
                <span>YouTube</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </a>
        </section>
    </main>

    <div id="ageModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Age Verification</h2>
            <p>This external link contains mature content intended only for individuals 18 years of age or older. Do you wish to continue?</p>
            <div class="modal-actions">
                <button type="button" class="modal-btn btn-cancel" onclick="document.getElementById('ageModal').style.display='none'">Go Back</button>
                <button type="button" class="modal-btn btn-confirm" onclick="window.open(['https:/','/fansly.com','/EarSnack'].join(''),'_blank','noopener,noreferrer');document.getElementById('ageModal').style.display='none'">I am 18+</button>
            </div>
        </div>
    </div>

</body>
</html>
